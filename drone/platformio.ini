; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [POSHOLD] `pio run` builds only the firmware; tests use `pio test -e native`.
[platformio]
default_envs = esp32-s3-devkitc-1

; [POSHOLD] Upstream used a global [env] section. It was renamed to
; [esp32_common] so that the host-side [env:native] test environment does not
; inherit the ESP32 platform, framework and libraries.
; Platform and library versions are pinned (see docs/decyzje/0002-*.md).
[esp32_common]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; [POSHOLD] shared drone/joystick/PC link definitions
lib_extra_dirs = ../common
lib_deps =
	fastled/FastLED @ 3.10.7
	tinyu-zhao/INA3221 @ 0.0.1
	mathertel/OneButton @ 2.6.2

[env:esp32-s3-devkitc-1]
extends = esp32_common
build_type = release
build_flags = -DCORE_DEBUG_LEVEL=0 -O0
extra_scripts = post:generate_user_custom.py
custom_firmware_version = 0.0.1
custom_firmware_name = stampfly_firmware
custom_firmware_suffix = .bin
custom_firmware_dir = ./

; [POSHOLD] Host-side unit tests (no hardware needed): pio test -e native
; Only hardware-independent code from lib/poshold is compiled here.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -Wall -Wextra
lib_compat_mode = off
lib_extra_dirs = ../common
lib_ignore = bmi270, vl53l3c, MdgwickAHRS
