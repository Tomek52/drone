<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StampFly telemetria</title>
<style>
:root { --bg:#10141a; --fg:#e6edf3; --dim:#8b98a5; --card:#1b222c; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
* { box-sizing:border-box; }
body { margin:0; padding:12px 16px; background:var(--bg); color:var(--fg); font:15px system-ui,sans-serif; }
h1 { font-size:18px; margin:0 0 8px; }
#status { padding:8px 10px; border-radius:8px; background:var(--card); margin-bottom:10px; }
#status b { font-weight:600; }
.ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
.tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:10px; }
.tile { background:var(--card); border-radius:8px; padding:8px 10px; }
.tile span { display:block; color:var(--dim); font-size:12px; }
.tile strong { font-size:22px; font-variant-numeric:tabular-nums; }
canvas { width:100%; height:130px; background:var(--card); border-radius:8px; display:block; margin-bottom:10px; }
.row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
button { flex:1; min-height:44px; border:0; border-radius:8px; background:#2f81f7; color:#fff; font-size:15px; }
button.sec { background:#30363d; }
details { background:var(--card); border-radius:8px; padding:8px 10px; margin-bottom:10px; }
table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
td { padding:2px 0; } td+td { text-align:right; }
p.hint { color:var(--dim); font-size:12px; margin:6px 0; }
</style>
</head>
<body>
<h1>StampFly telemetria</h1>
<div id="status">łączenie…</div>
<div class="tiles" id="tiles"></div>
<canvas id="plot" width="600" height="260"></canvas>
<div class="row">
  <button id="save">Zapisz CSV</button>
  <button id="clear" class="sec">Wyczyść zapis</button>
</div>
<details><summary>Wszystkie pola</summary><table id="all"></table></details>
<p class="hint">Zapis rusza sam z pierwszą ramką. Ekran telefonu musi być włączony, a ta karta na wierzchu: po wygaszeniu ekranu połączenie się zrywa i w pliku będzie dziura. Telemetria po ESP-NOW ma 25 Hz (kabel USB daje 50 Hz).</p>
<script>
"use strict";
// ---- frame decoder (mirror of tools/stampfly_telemetry.py) ----
function fletcher16(b, s, e) {
  var a = 0, c = 0;
  for (var i = s; i < e; i++) { a = (a + b[i]) % 255; c = (c + a) % 255; }
  return (c << 8) | a;
}
function Decoder() {
  this.names = null;
  this.pending = {};
  this.lastSeq = null;
  this.lost = 0;
  this.rows = 0;
  this.bad = 0;
}
// Decodes one frame (Uint8Array). Returns a row object {time_s, seq, names, values} or null.
Decoder.prototype.feed = function (b) {
  if (b.length < 6 || b[0] !== 0xA5 || b[1] !== 0x5A) { this.bad++; return null; }
  var n = b[3];
  if (b.length < 4 + n + 2) { this.bad++; return null; }
  var chk = b[4 + n] | (b[5 + n] << 8);
  if (chk !== fletcher16(b, 2, 4 + n)) { this.bad++; return null; }
  var dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  if (b[2] === 1 && n >= 4) {
    var total = b[5], first = b[6], count = b[7];
    var txt = "";
    for (var i = 8; i < 4 + n; i++) txt += String.fromCharCode(b[i]);
    var part = count ? txt.split(",") : [];
    if (part.length !== count || first + count > total) return null;
    if (first === 0) this.pending = {};
    this.pending[first] = { total: total, names: part };
    var names = [];
    while (this.pending[names.length]) {
      var p = this.pending[names.length];
      if (p.total !== total) return null;
      names = names.concat(p.names);
    }
    if (names.length === total) { this.names = names; this.pending = {}; }
    return null;
  }
  if (b[2] === 2 && n >= 6 && (n - 6) % 4 === 0 && this.names) {
    var cnt = (n - 6) / 4;
    if (cnt !== this.names.length) return null;
    var seq = dv.getUint16(8, true);
    if (this.lastSeq !== null) {
      var gap = (seq - this.lastSeq - 1) & 0xFFFF;
      if (gap < 1000) this.lost += gap;
    }
    this.lastSeq = seq;
    var values = new Array(cnt);
    for (var k = 0; k < cnt; k++) values[k] = dv.getFloat32(10 + 4 * k, true);
    this.rows++;
    return { time_s: dv.getUint32(4, true) * 1e-6, seq: seq, names: this.names, values: values };
  }
  return null;
};
// Number formatting as Python's csv writes floats (nan, inf).
function fmt(v) {
  if (v !== v) return "nan";
  if (v === Infinity) return "inf";
  if (v === -Infinity) return "-inf";
  return String(v);
}

// ---- recording: CSV parts (a new part starts when the schema changes) ----
var parts = [];
function record(row) {
  var head = "time_s,seq," + row.names.join(",");
  var cur = parts.length ? parts[parts.length - 1] : null;
  if (!cur || cur.head !== head) { cur = { head: head, lines: [] }; parts.push(cur); }
  var out = [fmt(row.time_s), String(row.seq)];
  for (var i = 0; i < row.values.length; i++) out.push(fmt(row.values[i]));
  cur.lines.push(out.join(","));
}
function stamp() {
  var d = new Date(), p = function (x) { return (x < 10 ? "0" : "") + x; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function saveCsv() {
  var base = "stampfly_" + stamp();
  parts.forEach(function (part, idx) {
    var blob = new Blob([part.head + "\r\n" + part.lines.join("\r\n") + "\r\n"], { type: "text/csv" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = base + (idx ? "_part" + idx : "") + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
}
function savedRows() { return parts.reduce(function (s, p) { return s + p.lines.length; }, 0); }

// ---- live view ----
var TILES = [
  ["alt_est_m", "wysokość [m]", 2], ["vbat_filt_v", "napięcie [V]", 2],
  ["mode", "tryb drona", 0], ["rc_flight_mode", "tryb lotu", 0],
  ["ph_state", "PosHold stan", 0], ["ph_reason", "PosHold powód", 0],
  ["hm_trust", "ToF wiarygodny", 0], ["alt_tof_m", "ToF [m]", 2],
  ["vz_mps", "prędkość pion [m/s]", 2], ["flow_squal", "flow squal", 0]
];
var tilesEl = document.getElementById("tiles"), tileVal = {};
TILES.forEach(function (t) {
  var d = document.createElement("div");
  d.className = "tile";
  d.innerHTML = "<span>" + t[1] + "</span><strong>–</strong>";
  tilesEl.appendChild(d);
  tileVal[t[0]] = d.lastChild;
});
var dec = new Decoder(), last = null, lastAt = 0, connected = false, hist = [], allDirty = 0;
var statusEl = document.getElementById("status");

function onFrame(bytes) {
  var row = dec.feed(bytes);
  if (!row) return;
  record(row);
  last = row;
  lastAt = performance.now();
  var o = {};
  for (var i = 0; i < row.names.length; i++) o[row.names[i]] = row.values[i];
  hist.push({ t: row.time_s, e: o.alt_est_m, r: o.alt_ref_m, f: o.alt_tof_m });
  while (hist.length && hist[0].t < row.time_s - 30) hist.shift();
}
function render() {
  var age = last ? (performance.now() - lastAt) / 1000 : -1;
  var cls = !connected ? "bad" : (age < 0 || age > 1 ? "warn" : "ok");
  var txt = connected ? "połączono z pilotem" : "brak połączenia z pilotem";
  if (connected) txt += last ? (age > 1 ? ", brak ramek od " + age.toFixed(1) + " s" : ", dane płyną") : ", czekam na dane z drona";
  statusEl.innerHTML = "<b class='" + cls + "'>" + txt + "</b><br>wiersze: " + dec.rows + " · utracone: " + dec.lost +
    " · błędne: " + dec.bad;
  if (last) {
    var o = {};
    for (var i = 0; i < last.names.length; i++) o[last.names[i]] = last.values[i];
    TILES.forEach(function (t) {
      var v = o[t[0]];
      tileVal[t[0]].textContent = v === undefined ? "–" : v.toFixed(t[2]);
    });
    if (++allDirty % 4 === 0) {
      var html = "";
      for (var j = 0; j < last.names.length; j++) html += "<tr><td>" + last.names[j] + "</td><td>" + fmt(+last.values[j].toFixed(4)) + "</td></tr>";
      document.getElementById("all").innerHTML = html;
    }
  }
  plot();
  requestAnimationFrame(function () { setTimeout(render, 200); });
}
function plot() {
  var c = document.getElementById("plot"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  if (hist.length < 2) return;
  var t1 = hist[hist.length - 1].t, t0 = t1 - 30, hi = 1.5;
  hist.forEach(function (h) { hi = Math.max(hi, h.e || 0, h.r || 0, h.f || 0); });
  hi = Math.ceil(hi * 2) / 2;
  function line(key, color) {
    g.beginPath(); g.strokeStyle = color; g.lineWidth = 2;
    var started = false;
    hist.forEach(function (h) {
      if (h[key] === undefined || h[key] !== h[key]) return;
      var x = (h.t - t0) / 30 * c.width, y = c.height - 6 - (h[key] / hi) * (c.height - 12);
      if (started) g.lineTo(x, y); else { g.moveTo(x, y); started = true; }
    });
    g.stroke();
  }
  line("f", "#8b98a5"); line("r", "#d29922"); line("e", "#3fb950");
  g.fillStyle = "#8b98a5"; g.font = "20px system-ui";
  g.fillText(hi.toFixed(1) + " m  (zielony: wysokość, żółty: zadana, szary: ToF, 30 s)", 6, 20);
}

// ---- connection ----
function connect() {
  var ws;
  try { ws = new WebSocket("ws://" + location.hostname + ":81/"); } catch (e) { setTimeout(connect, 1000); return; }
  ws.binaryType = "arraybuffer";
  ws.onopen = function () { connected = true; };
  ws.onmessage = function (ev) { onFrame(new Uint8Array(ev.data)); };
  ws.onclose = function () { connected = false; setTimeout(connect, 1000); };
  ws.onerror = function () { ws.close(); };
}

document.getElementById("save").onclick = function () {
  if (!savedRows()) { alert("Brak danych do zapisania."); return; }
  saveCsv();
};
document.getElementById("clear").onclick = function () {
  if (savedRows() && !confirm("Usunąć " + savedRows() + " zapisanych wierszy?")) return;
  parts = []; dec.rows = 0; dec.lost = 0; dec.bad = 0; dec.lastSeq = null; hist = [];
};
window.addEventListener("beforeunload", function (e) { if (savedRows()) { e.preventDefault(); e.returnValue = ""; } });
try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {}

if (window.SELFTEST_FRAMES) {
  // test hook (tools/test_phone_page.py): feeds hex frames, writes the CSV into the DOM
  window.SELFTEST_FRAMES.forEach(function (hex) {
    var b = new Uint8Array(hex.length / 2);
    for (var i = 0; i < b.length; i++) b[i] = parseInt(hex.substr(2 * i, 2), 16);
    onFrame(b);
  });
  var pre = document.createElement("pre");
  pre.id = "selftest";
  pre.textContent = JSON.stringify({ parts: parts, rows: dec.rows, lost: dec.lost, bad: dec.bad });
  document.body.appendChild(pre);
} else {
  connect();
  render();
}
</script>
</body>
</html>
