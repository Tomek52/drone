; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [POSHOLD] `pio run` builds the AtomS3 (K137, non-R) target used in this project.
[platformio]
default_envs = m5stack-atoms3

; [POSHOLD] Library versions pinned exactly (see docs/decyzje/0002-*.md).
; LVGL 8.3.10 is taken from the PlatformIO registry instead of a GitHub source
; archive URL (same version, reproducible, works behind restrictive proxies).
[env]
platform = espressif32 @ 6.12.0
board = m5stack-atoms3
framework = arduino
board_build.partitions = partitions.csv
; [POSHOLD] shared drone/joystick/PC link definitions
lib_extra_dirs = ../common
lib_deps = 
    m5stack/M5GFX @ 0.2.33
	fastled/FastLED @ 3.10.7
    lvgl/lvgl @ 8.3.10
; [POSHOLD] The firmware does not use an SD card. On Windows FastLED's
; __has_include(<fs.h>) finds the framework's FS.h (case-insensitive filesystem)
; and compiles its SD implementation, which fails with GCC 8.4. See drone/platformio.ini.
lib_ignore = SD

[env:m5stack-atoms3]
build_type = release
build_flags = -DCORE_DEBUG_LEVEL=0 -O0
			  -I include
			  -D LV_CONF_INCLUDE_SIMPLE  ; If use lv_conf.h, set this.
			  -D LV_LVGL_H_INCLUDE_SIMPLE
			  -D LCD_HEIGHT=128
			  -D LCD_WIDTH=128
			  -D LV_TICK_PERIOD_MS=2
extra_scripts = post:generate_user_custom.py
custom_firmware_version = 0.0.1
custom_firmware_name = atomjoystick_firmware
custom_firmware_suffix = .bin
custom_firmware_dir = ./

[env:m5stack-atoms3r]
build_type = release
build_flags = -DCORE_DEBUG_LEVEL=0 -O0
			  -I include
			  -D LV_CONF_INCLUDE_SIMPLE  ; If use lv_conf.h, set this.
			  -D LV_LVGL_H_INCLUDE_SIMPLE
			  -D LCD_HEIGHT=128
			  -D LCD_WIDTH=128
			  -D LV_TICK_PERIOD_MS=2
extra_scripts = post:generate_user_custom.py
custom_firmware_version = 1.2.0
custom_firmware_name = atomjoystick_firmware
custom_firmware_suffix = .bin
custom_firmware_dir = ./
